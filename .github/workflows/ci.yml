name: CI

on:
  push:
  pull_request:
  # The Release workflow builds through this one, with the version it releases.
  workflow_call:
    inputs:
      version:
        description: Version to build as (scripts/release.py sets it), such as 0.1.0
        required: false
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    # GNOME 51's GTK and libadwaita, which the app builds against.
    container: fedora:45
    steps:
      - name: Install the build dependencies
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc python3 gtk4-devel libadwaita-devel libsecret-devel glib2-devel
          blueprint-compiler
      - uses: actions/checkout@v7
      # A release builds with its version set (and the changelog moved), as the publish job will.
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests only: the checks that ask the forges are tried by running the app.
      - run: cargo test --locked
