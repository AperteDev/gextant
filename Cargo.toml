[package]
name = "gextant"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Updates GNOME Shell extensions straight from their upstream repositories"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libsecret = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["platform-verifier"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
